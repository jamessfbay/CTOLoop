[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctoloop"
version = "0.1.0"
description = "Governed GitHub-to-Codex automation for issue delivery, review, and CI diagnosis"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ctoloop = "ctoloop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["state", ".git", ".venv"]
