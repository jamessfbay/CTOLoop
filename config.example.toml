[github]
ready_label = "agent:ready"
working_label = "agent:working"
pr_label = "agent:pr-open"
failed_label = "agent:failed"
max_issues_per_poll = 1
gh_executable = "gh"

[scheduler]
poll_seconds = 60
max_parallel_repositories = 2

[[repositories]]
repository = "your-org/your-repo"
path = "state/repositories/your-org/your-repo"
base_branch = "main"
branch_prefix = "codex/issue-"
worktree_root = "/tmp/your-repo-ctoloop"
# Optional: after a PR is merged, fast-forward this checkout from origin/main.
# production_path = "/srv/your-repo"
# Optional: use a separate Git checkout and copy only tracked files to production_path.
# production_checkout_path = "/srv/your-repo-checkout"
git_user_name = "CTOLoop"
git_user_email = "ctoloop@example.com"

# Optional commands run in production_path after the merged revision is copied.
# They run in order and are skipped when no entries are configured. Use argv
# arrays rather than shell strings, and keep commands idempotent because a
# failed deployment is retried on the next polling cycle.
# [[repositories.production_commands]]
# name = "build-frontend"
# argv = ["npm", "run", "build"]
# timeout_seconds = 1800
#
# [[repositories.production_commands]]
# name = "restart-service"
# argv = ["systemctl", "--user", "restart", "my-app.service"]
# timeout_seconds = 120

[repositories.github]
# Use a stored gh account without changing the globally active account.
auth_user = "your-github-user"
# Keep this repository's credentials isolated from every other repository.
auth_config_dir = "state/github-auth/your-repo"
# Alternatively, load a token from the named environment variable.
# token_env = "YOUR_REPO_GITHUB_TOKEN"

[codex]
executable = "codex"
model = ""
timeout_seconds = 3600
sandbox = "workspace-write"
approval_policy = "never"

[automation]
agent_name = "CTOLoop"
agent_icon = "🤖"
create_draft_pr = false
enable_auto_merge = false
merge_method = "squash"
delete_branch_after_merge = true
allowed_issue_authors = []
max_issue_images = 4
max_issue_image_bytes = 15000000
protected_paths = [
  ".github/workflows/*",
  "CTOLoop/*",
  "src/ctoloop/*",
  ".env",
  ".env.*",
  "*.pem",
  "*.key",
  "exportApiEnv.sh",
  "exportFrontendEnv.sh",
  "contracts/export_env.sh",
]

# Commands are argv arrays: no shell expansion is performed.
[[repositories.validation]]
name = "tests"
argv = ["python3", "-m", "pytest", "-q"]
timeout_seconds = 1200

# Add another repository by repeating this block. Every repository must have a
# unique local checkout and worktree_root. Validation commands belong to the
# [[repositories]] entry immediately above them.
#
# [[repositories]]
# repository = "your-org/another-repo"
# path = "state/repositories/your-org/another-repo"
# base_branch = "main"
# branch_prefix = "codex/issue-"
# worktree_root = "/tmp/another-repo-ctoloop"
# git_user_name = "CTOLoop"
# git_user_email = "ctoloop@example.com"
#
# [[repositories.validation]]
# name = "tests"
# argv = ["/var/www/another-repo/.venv/bin/python", "-m", "pytest", "-q"]
# timeout_seconds = 1200
